<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${appName} + ' Start'">Jellyfish Start</title>
    <link rel="stylesheet" th:href="@{/css/w3.css}" href="../static/css/w3.css">
    <link rel="stylesheet" th:href="@{/css/w3-colors-win8.css}" href="../static/css/w3-colors-win8.css">
    <style>
        :root {
            --tile: 150px;
            --gap: 8px;
            --bg: #1d1d1d;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: #fff;
            font-family: "Segoe UI", "Segoe UI Web", "Helvetica Neue", Arial, sans-serif;
        }

        .start-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 32px 48px 24px;
        }

        .start-header h1 {
            margin: 0;
            font-weight: 200;
            font-size: 48px;
            letter-spacing: 0.5px;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 300;
            text-align: right;
        }

        .user .avatar {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            font-size: 18px;
        }

        .user small {
            display: block;
            opacity: 0.7;
        }

        .groups {
            display: flex;
            flex-wrap: wrap;
            gap: 48px;
            padding: 0 48px 64px;
        }

        .group h2 {
            margin: 0 0 12px;
            font-size: 20px;
            font-weight: 300;
        }

        .tiles {
            display: grid;
            grid-template-columns: repeat(4, var(--tile));
            grid-auto-rows: var(--tile);
            grid-auto-flow: dense;
            gap: var(--gap);
        }

        .tile {
            position: relative;
            border: 0;
            padding: 12px;
            color: #fff;
            text-align: left;
            font: inherit;
            cursor: pointer;
            overflow: hidden;
            outline-offset: 3px;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .tile:hover {
            box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.35);
        }

        .tile:focus-visible {
            outline: 3px solid #fff;
        }

        .tile:disabled {
            cursor: default;
            opacity: 0.6;
        }

        .tile.pressed {
            transform: scale(0.95);
        }

        .tile.wide {
            grid-column: span 2;
        }

        .tile.large {
            grid-column: span 2;
            grid-row: span 2;
        }

        .tile svg {
            width: 48px;
            height: 48px;
            stroke: #fff;
            fill: none;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .tile .center {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
        }

        .tile .label {
            position: absolute;
            left: 12px;
            bottom: 8px;
            font-size: 14px;
        }

        .tile .badge {
            position: absolute;
            right: 12px;
            bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .tile .big {
            font-size: 56px;
            font-weight: 200;
            line-height: 1;
        }

        .tile .live {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .tile .live.flip {
            opacity: 0;
            transform: translateY(16px);
        }

        .tile .sub {
            font-size: 15px;
            font-weight: 300;
            opacity: 0.9;
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            margin-right: 6px;
            vertical-align: middle;
        }

        .status-dot.warn {
            animation: blink 1s steps(2, start) infinite;
        }

        @keyframes blink {
            to { visibility: hidden; }
        }

        .charms {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 48px;
            background: rgba(0, 0, 0, 0.6);
            font-size: 13px;
            font-weight: 300;
        }

        .w3-modal-content {
            max-width: 520px;
            color: #fff;
        }

        .w3-modal-content h3 {
            font-weight: 300;
        }

        .modal-close {
            border: 0;
            background: transparent;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            :root {
                --tile: calc((100vw - 32px - 3 * var(--gap)) / 4);
            }

            .start-header {
                padding: 20px 16px 16px;
            }

            .start-header h1 {
                font-size: 32px;
            }

            .user small {
                display: none;
            }

            .groups {
                padding: 0 16px 64px;
                gap: 32px;
            }

            .tile.small-mobile {
                grid-column: span 2;
                grid-row: span 2;
            }

            .tile.large,
            .tile.wide {
                grid-column: span 4;
                grid-row: span 2;
            }

            .tile .big {
                font-size: 40px;
            }

            .charms {
                padding: 8px 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .tile, .tile .live { transition: none; }
            .status-dot.warn { animation: none; }
        }
    </style>
</head>
<body th:attr="data-manifest-url=@{/api/manifest}" data-manifest-url="/api/manifest">

<header class="start-header">
    <h1>Start</h1>
    <div class="user">
        <div>
            <span th:text="${appName}">Jellyfish</span>
            <small>Dashboard</small>
        </div>
        <div class="avatar w3-win8-violet">J</div>
    </div>
</header>

<main class="groups" id="groups">
    <noscript>This page needs JavaScript to load its tiles.</noscript>
</main>

<footer class="charms">
    <span id="status-message">Ready</span>
    <span id="status-time"></span>
</footer>

<div id="tile-modal" class="w3-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="w3-modal-content w3-animate-right" id="modal-panel">
        <div class="w3-container w3-padding-16">
            <div class="w3-bar">
                <h3 class="w3-bar-item w3-padding-0" id="modal-title">Tile</h3>
                <button class="modal-close w3-right" id="modal-close" aria-label="Close">&times;</button>
            </div>
            <p id="modal-body"></p>
            <div id="modal-actions"></div>
        </div>
    </div>
</div>

<script type="module" th:src="@{/js/main.js}" src="../static/js/main.js"></script>
</body>
</html>
