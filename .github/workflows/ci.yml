name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Build inside Microsoft's Build of OpenJDK 17. The image ships the JDK
    # but not Maven, so Maven is installed below.
    container: mcr.microsoft.com/openjdk/jdk:17-ubuntu
    env:
      MAVEN_VERSION: 3.9.16
      MAVEN_SHA512: 831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git
          curl -fsSLo /tmp/maven.tar.gz "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          echo "${MAVEN_SHA512}  /tmp/maven.tar.gz" | sha512sum -c -
          tar -xzf /tmp/maven.tar.gz -C /opt
          echo "/opt/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-msopenjdk17-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-msopenjdk17-

      - name: Show toolchain
        run: |
          grep PRETTY_NAME /etc/os-release
          java -version
          mvn -v

      - name: Build with Maven
        run: mvn -B verify -Dgit.sha=${{ github.sha }}

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jellyfish-newapp
          path: target/*.jar

  container-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t jellyfish-newapp .

      # Run with the limits of a Cloudflare "standard-1" instance (4 GiB, 1/2 vCPU).
      - name: Start container and wait for the app
        run: |
          docker run -d --name app -p 8080:8080 --memory 4g --cpus 0.5 jellyfish-newapp
          start=$(date +%s)
          until curl -fsS -o /dev/null http://localhost:8080/; do
            if [ $(( $(date +%s) - start )) -ge 120 ]; then
              docker logs app
              echo "::error::App did not answer on port 8080 within 120s"
              exit 1
            fi
            sleep 1
          done
          echo "::notice title=Container startup::Answered on port 8080 after $(( $(date +%s) - start ))s at 4 GiB / 0.5 vCPU"

      - name: Check page and static files
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<h1>Start</h1>'
          curl -fsS -o /dev/null http://localhost:8080/css/w3.css
          curl -fsS -o /dev/null http://localhost:8080/css/w3-colors-win8.css
          curl -fsS -o /dev/null http://localhost:8080/js/main.js
          curl -fsS -o /dev/null http://localhost:8080/tiles/clock/v1/index.js
          manifest=$(curl -fsS http://localhost:8080/api/manifest)
          echo "$manifest" | grep -q '"id":"clock"'
          echo "$manifest" | grep -q "\"gitSha\":\"${GITHUB_SHA}\""
          ver=$(docker exec app /usr/jdk/bin/java -version 2>&1 | sed -n 2p || true)
          user=$(docker inspect -f '{{.Config.User}}' jellyfish-newapp)
          size=$(docker image inspect -f '{{.Size}}' jellyfish-newapp | awk '{printf "%.0fMB", $1/1000000}')
          echo "::notice title=Container image::$ver | user $user | $size"

      - name: Container logs
        if: always()
        run: docker logs app || true

  # SBOM, open-source notice and security/license risk report with SK Telecom's
  # BomLens (https://github.com/sktelecom/bomlens). The script and the scanner
  # image are pinned to the same release.
  sbom:
    runs-on: ubuntu-latest
    env:
      BOMLENS_VERSION: 1.14.3
    steps:
      - uses: actions/checkout@v4

      - name: Install BomLens
        run: |
          git clone --depth 1 --branch "v${BOMLENS_VERSION}" https://github.com/sktelecom/bomlens.git /tmp/bomlens
          echo "SBOM_SCANNER_IMAGE=ghcr.io/sktelecom/bomlens:${BOMLENS_VERSION}" >> "$GITHUB_ENV"

      - name: Pull scanner image
        run: docker pull "$SBOM_SCANNER_IMAGE"

      # Vulnerabilities are report-only (see the security and risk reports).
      # Exits 4 on a known malicious package, and 5 if that cannot be judged.
      - name: Scan
        run: |
          /tmp/bomlens/scripts/scan-sbom.sh \
            --project "${{ github.event.repository.name }}" \
            --version "${{ github.sha }}" \
            --all --generate-only \
            --fail-on malicious-package

      - name: Upload SBOM and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            */*_bom.json
            */*_bom.spdx.json
            */*_NOTICE.*
            */*_security.*
            */*_risk-report.*
          if-no-files-found: warn

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --no-audit --no-fund

      # Generates types, type-checks the Worker and validates wrangler.jsonc
      # (including the container image build) without deploying.
      - name: Check Worker
        run: npm run check

  # Drives the jar built by the build job in a real browser (Playwright,
  # Chromium only): every tile, the failure paths, the diagnostics tiles and the
  # mobile layout. The tests live in e2e/, separate from the Worker's package.json.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the jar from the build job
        uses: actions/download-artifact@v4
        with:
          name: jellyfish-newapp
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install test dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      # The browser download is cached; its system libraries are not.
      - name: Install Chromium
        working-directory: e2e
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Start the app
        run: |
          java_bin="${JAVA_HOME_17_X64:-$JAVA_HOME}/bin/java"
          "$java_bin" -version
          nohup "$java_bin" -jar "$(ls app/*.jar | head -1)" --server.port=8080 > app.log 2>&1 &
          echo $! > app.pid
          start=$(date +%s)
          until curl -fsS -o /dev/null http://localhost:8080/api/manifest; do
            if [ $(( $(date +%s) - start )) -ge 60 ]; then
              cat app.log
              echo "::error::/api/manifest did not respond within 60s"
              exit 1
            fi
            sleep 1
          done

      - name: Run Playwright tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
          E2E_EXPECTED_SHA: ${{ github.sha }}
        run: npx playwright test

      - name: Stop the app
        if: always()
        run: kill "$(cat app.pid)" 2>/dev/null || true

      - name: Upload report, traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            app.log
          if-no-files-found: warn
